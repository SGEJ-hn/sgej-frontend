<aside class="w-72 h-screen bg-[#4B1623] text-[#F3E8E8] flex flex-col justify-between select-none shadow-xl shrink-0 custom-font">

  <!-- SECCIÓN SUPERIOR -->
  <div>

    <!-- LOGO -->
    <div class="p-4 flex items-center gap-2 border-b border-[#FFFFFF]/54">
      <img 
        src="/logosgej.png" 
        alt="Logo de la Compañía" 
        class="w-20 h-20 object-contain">

      <div class="flex flex-col items-center">
        <h1 class="text-3xl font-bold tracking-wider text-[#D2B48C] leading-tight">
          JUSTICE
        </h1>
        <p class="text-[12px] tracking-[0.25em] text-[#D2B48C] uppercase">
          Attorney Law
        </p>
      </div>
    </div>


    <!-- TITULO MENU -->
    <div class="px-6 pt-6 pb-3">
      <span class="text-menu font-medium text-[#ffffff]/56">
        Menu de Navegación
      </span>
    </div>


    <!-- MENU DINAMICO -->
    <nav class="flex flex-col gap-0">
      <ng-container *ngFor="let item of menuFiltrado">
        
        <!-- ELEMENTOS CLICKEABLES (TODOS MENOS DOCUMENTOS) -->
        <a *ngIf="item.nombre !== 'Documentos'"
          [routerLink]="item.ruta"
          [ngClass]="esActivo(item) 
            ? 'bg-[#1A0C10]/33 text-[#D2B48C] border-l-4 border-[#D2B48C]' 
            : 'text-[#AEAEAE]/70 hover:bg-[#1A0C10]/33 hover:text-[#D2B48C] border-l-4 border-transparent'"
          class="flex items-center gap-3 px-6 py-3 transition-all cursor-pointer">
  
          <ng-icon
            [name]="item.icono"
            class="text-xl text-[#D2B48C]">
          </ng-icon>
  
          <span class="text-sidebar">
            {{ item.nombre }}
          </span>
        </a>

        <!-- ELEMENTO NO CLICKEABLE (AYUDA VISUAL - SOLO DOCUMENTOS) -->
        <div *ngIf="item.nombre === 'Documentos'"
          [ngClass]="esActivo(item) 
            ? 'bg-[#1A0C10]/33 text-[#D2B48C] border-l-4 border-[#D2B48C]' 
            : 'text-[#AEAEAE]/70 border-l-4 border-transparent'"
          class="flex items-center gap-3 px-6 py-3 transition-all cursor-default select-none">
  
          <ng-icon
            [name]="item.icono"
            class="text-xl text-[#D2B48C]">
          </ng-icon>
  
          <span class="text-sidebar">
            {{ item.nombre }}
          </span>
        </div>

      </ng-container>
    </nav>
  </div>

  <!-- PERFIL Y LOGOUT -->
  <div class="p-6 border-t border-[#FFFFFF]/54">
    <div class="flex items-center gap-3 mb-4">
      <!-- INICIALES -->
      <div class="w-10 h-10 rounded-full bg-[#D2B48C] text-[#4B1623] font-bold flex items-center justify-center shrink-0">
        {{ iniciales }}
      </div>

      <!-- DATOS USUARIO -->
      <div class="overflow-hidden">
        <h3 class="text-lg font-light text-white truncate">
          {{ usuario?.nombre || 'Administrador' }}
        </h3>
        <p class="text-sm text-[#ffffff]/56 truncate">
          {{ usuario?.rol || 'Administrador' }}
        </p>
      </div>
    </div>

    <!-- CERRAR SESION -->
    <button 
      (click)="logout()"
      class="flex items-center gap-2 text-menu text-[#ffffff]/56 hover:text-white transition-colors cursor-pointer w-full pt-2">
      <ng-icon
        name="heroArrowRightOnRectangle"
        class="text-xl text-[#ffffff]/56">
      </ng-icon>
      <span>
        Cerrar Sesión
      </span>
    </button>
  </div>
</aside>
