<!-- Contenedor Principal del Header: Altura fija (h-24), fondo blanco y borde inferior -->
<div class="h-24 bg-white border-b border-[#AEAEAE]/70 px-8 flex justify-between items-center w-full">
  
  <!-- Lado Izquierdo: Título y Subtítulo Dinámicos -->
  <div class="pl-5">
    <h1 class="text-[22px] text-gray-900 border-l-2 border-[#4a1525] pl-3">{{ titulo }}</h1>
    <p class="text-sm text-[#000000]/60 mt-1 pl-4">{{ subtitulo }}</p>
  </div>

  <!-- Lado Derecho: Botones Proyectados + Iconos Globales -->
  <div class="flex items-center gap-6">
    
    <!-- ZONA DE INYECCIÓN: Aquí aparecerán los botones extra (Exportar, Volver, etc.) -->
    <div class="flex items-center gap-4">
      <ng-content></ng-content>
    </div>

    <!-- Iconos Globales (Campana y Configuración) -->
    <div *ngIf="mostrarIconos" class="flex items-center gap-4 text-[#4B1623]">
      
      <!-- Componente Dinámico de Notificaciones -->
      <app-notification-bell></app-notification-bell>

      <!-- Separador Vertical -->
      <div class="h-6 w-px bg-[#D9D9D9] mx-1"></div>

      <!-- Icono Configuración -->
      <button class="hover:opacity-80 transition-opacity cursor-pointer flex items-center justify-center p-1">
        <ng-icon name="heroCog8ToothSolid" size="1.6rem"></ng-icon>
      </button>
      
    </div>
  </div>

</div>
