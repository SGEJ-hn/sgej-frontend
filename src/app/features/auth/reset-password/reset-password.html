<div class="min-h-screen bg-[#F3F2EE] font-sans custom-font flex flex-col items-center justify-center p-4">
  
  <div class="bg-white border border-gray-200 p-8 w-full max-w-md shadow-sm">
    <h2 class="text-lg font-medium text-gray-900 border-l-[3px] border-[#4B1623] pl-3 mb-2">
      Crear Nueva Contraseña
    </h2>
    <p class="text-sm text-gray-500 mb-6">
      Por favor, ingrese su nueva contraseña a continuación.
    </p>

    <!-- Éxito -->
    <div *ngIf="mensajeExito" class="flex flex-col items-center justify-center text-center py-6">
      <div class="text-green-500 mb-4">
        <ng-icon name="heroCheckCircle" size="4rem"></ng-icon>
      </div>
      <p class="text-green-700 font-medium">{{ mensajeExito }}</p>
      <p class="text-sm text-gray-500 mt-2">Redirigiendo al inicio de sesión...</p>
    </div>

    <!-- Error -->
    <div *ngIf="mensajeError" class="bg-red-50 border border-red-200 text-red-700 p-4 mb-6 text-sm">
      {{ mensajeError }}
    </div>

    <!-- Formulario -->
    <div *ngIf="!mensajeExito && token">
      <div class="mb-4">
        <label class="block text-xs text-gray-500 mb-2 texto-sec">Nueva Contraseña</label>
        <div class="relative">
          <input 
            type="password" 
            [(ngModel)]="nuevaContrasena"
            class="w-full border border-gray-300 p-3 pl-10 text-sm focus:outline-none focus:border-[#d4b88c] focus:ring-1 focus:ring-[#d4b88c]">
          <div class="absolute left-3 top-3 text-gray-400">
            <ng-icon name="heroKey" size="1.2rem"></ng-icon>
          </div>
        </div>
      </div>

      <div class="mb-6">
        <label class="block text-xs text-gray-500 mb-2 texto-sec">Confirmar Contraseña</label>
        <div class="relative">
          <input 
            type="password" 
            [(ngModel)]="confirmarContrasena"
            class="w-full border border-gray-300 p-3 pl-10 text-sm focus:outline-none focus:border-[#d4b88c] focus:ring-1 focus:ring-[#d4b88c]">
          <div class="absolute left-3 top-3 text-gray-400">
            <ng-icon name="heroKey" size="1.2rem"></ng-icon>
          </div>
        </div>
      </div>

      <button 
        (click)="restablecer()"
        [disabled]="estaCargando"
        class="w-full px-6 py-3 bg-[#4B1623] hover:bg-[#38101c]/90 text-[#F3F2EE] font-medium flex items-center justify-center transition-colors cursor-pointer disabled:opacity-70 disabled:cursor-not-allowed">
        {{ estaCargando ? 'Guardando...' : 'Guardar Nueva Contraseña' }}
      </button>
    </div>

    <!-- Si no hay token válido -->
    <div *ngIf="!token" class="mt-6 text-center">
      <a routerLink="/olvide-password" class="px-6 py-2 bg-[#d4b88c] hover:bg-[#c4a67a] text-gray-900 text-sm font-medium transition-colors cursor-pointer inline-block">
        Solicitar nuevo enlace
      </a>
    </div>

  </div>
</div>
