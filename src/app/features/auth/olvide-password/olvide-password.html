<div class="min-h-screen bg-[#F3F2EE] custom-font flex flex-col items-center justify-center p-4">
  
  <div class="bg-white border border-gray-200 p-8 w-full max-w-md shadow-sm">
    <!-- Título con el estilo de tu sistema -->
    <h2 class="text-lg font-medium text-gray-900 border-l-[3px] border-[#4B1623] pl-3 mb-2">
      Recuperar Contraseña
    </h2>
    <p class="text-sm text-gray-500 mb-6">
      Ingrese su correo electrónico y le enviaremos un enlace para restablecer su contraseña.
    </p>

    <!-- Alertas -->
    <div *ngIf="mensajeExito" class="bg-green-50 border border-green-200 text-green-700 p-4 mb-6 text-sm">
      {{ mensajeExito }}
    </div>
    
    <div *ngIf="mensajeError" class="bg-red-50 border border-red-200 text-red-700 p-4 mb-6 text-sm">
      {{ mensajeError }}
    </div>

    <!-- Formulario -->
    <div *ngIf="!mensajeExito" class="mb-6">
      <label class="block text-xs text-gray-500 mb-2">Correo Electrónico</label>
      <div class="relative texto-sec">
        <input 
          type="email" 
          [(ngModel)]="correo"
          placeholder="ejemplo@correo.com" 
          class="w-full border border-gray-300 p-3 pl-10 text-sm focus:outline-none focus:border-[#d4b88c] focus:ring-1 focus:ring-[#d4b88c]">
        <div class="absolute left-3 top-3 text-gray-400">
          <ng-icon name="heroEnvelope" size="1.2rem"></ng-icon>
        </div>
      </div>
    </div>

    <button 
      *ngIf="!mensajeExito"
      (click)="solicitarRecuperacion()"
      [disabled]="estaCargando"
      class="w-full px-6 py-3 bg-[#4B1623] hover:bg-[#38101c]/90 text-[#F3F2EE] font-medium flex items-center justify-center gap-2 transition-colors cursor-pointer disabled:opacity-70 disabled:cursor-not-allowed mb-6">
      {{ estaCargando ? 'Enviando...' : 'Enviar enlace de recuperación' }}
    </button>

    <!-- Enlace de regreso -->
    <div class="text-center mt-4 pt-4 border-t border-gray-100">
      <a routerLink="/login" class="text-sm text-[#d4b88c] hover:text-[#b89e78] font-medium inline-flex items-center gap-1 transition-colors">
        <ng-icon name="heroArrowLeft" size="1rem"></ng-icon>
        Volver al inicio de sesión
      </a>
    </div>
  </div>
</div>
