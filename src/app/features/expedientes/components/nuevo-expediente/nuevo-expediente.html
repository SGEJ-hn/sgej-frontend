<div class="min-h-screen bg-[#f8f7f5] font-sans custom-font">
  <!-- ENCABEZADO SUPERIOR -->
  <app-shared-header
    titulo="Nuevo Expediente"
    subtitulo="Apertura y clasificación de un nuevo caso jurídico">
  </app-shared-header>

  <div class="max-w-6xl mx-auto p-6 md:p-8">
    <!-- NAVEGACIÓN Y BREADCRUMB -->
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-2 text-sm text-gray-500">
        <a routerLink="/expedientes/lista" class="hover:text-[#4A1525] transition-colors">Expedientes</a>
        <span>/</span>
        <span class="text-gray-900 font-medium">Nuevo</span>
      </div>

      <div class="flex items-center gap-3">
        <button
          type="button"
          (click)="cancelar()"
          class="px-5 py-2 border border-gray-300 rounded text-sm text-gray-700 bg-white hover:bg-gray-50 transition cursor-pointer">
          Cancelar
        </button>
        <button
          type="button"
          (click)="onSubmit()"
          [disabled]="guardando"
          class="px-5 py-2 bg-[#4A1525] hover:bg-[#38101c] text-white rounded text-sm font-medium transition cursor-pointer flex items-center gap-2">
          <span *ngIf="guardando" class="inline-block animate-spin">⌛</span>
          <span>{{ guardando ? 'Guardando...' : 'Crear Expediente' }}</span>
        </button>
      </div>
    </div>

    <!-- ALERTAS DE ÉXITO / ERROR -->
    <div *ngIf="mensajeError" class="mb-6 p-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg flex items-center gap-3">
      <span>⚠️</span>
      <span>{{ mensajeError }}</span>
    </div>

    <div *ngIf="mensajeExito" class="mb-6 p-4 bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg flex items-center gap-3">
      <span>✅</span>
      <span>{{ mensajeExito }}</span>
    </div>

    <!-- FORMULARIO PRINCIPAL -->
    <form [formGroup]="expedienteForm" (ngSubmit)="onSubmit()" class="space-y-6">

      <!-- TARJETA 1: CLASIFICACIÓN DEL EXPEDIENTE -->
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <h2 class="text-lg font-semibold text-[#4A1525] mb-4 pb-2 border-b border-gray-100 flex items-center gap-2">
          <span>📋</span> Clasificación del Expediente
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
          <!-- Tipo / Materia -->
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
              Tipo de Expediente / Materia *
            </label>
            <select
              formControlName="materia"
              class="w-full p-2.5 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-[#d4b88c] focus:outline-none bg-white">
              <option *ngFor="let m of materias" [value]="m">{{ m }}</option>
            </select>
          </div>

          <!-- Número de Expediente -->
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
              Número de Expediente *
            </label>
            <input
              type="text"
              formControlName="numero_expediente"
              placeholder="Ej: EXP-2026-0015"
              class="w-full p-2.5 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-[#d4b88c] focus:outline-none bg-white" />
          </div>

          <!-- Tribunal / Instancia -->
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
              Tribunal / Instancia *
            </label>
            <select
              formControlName="tribunal_juzgado"
              class="w-full p-2.5 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-[#d4b88c] focus:outline-none bg-white">
              <option *ngFor="let t of tribunales" [value]="t">{{ t }}</option>
            </select>
          </div>

          <!-- Fecha de Inicio / Apertura -->
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
              Fecha de Inicio / Apertura *
            </label>
            <input
              type="date"
              formControlName="fecha_apertura"
              class="w-full p-2.5 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-[#d4b88c] focus:outline-none bg-white" />
          </div>

          <!-- Estatus / Estado -->
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
              Estatus / Estado *
            </label>
            <select
              formControlName="estado"
              class="w-full p-2.5 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-[#d4b88c] focus:outline-none bg-white">
              <option *ngFor="let e of estados" [value]="e">{{ e }}</option>
            </select>
          </div>

          <!-- Juez a Cargo -->
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
              Juez a Cargo (Opcional)
            </label>
            <input
              type="text"
              formControlName="juez_cargo"
              placeholder="Nombre del juez"
              class="w-full p-2.5 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-[#d4b88c] focus:outline-none bg-white" />
          </div>
        </div>
      </div>

      <!-- SECCIÓN PARTES INVOLUCRADAS (DEMANDANTE Y DEMANDADO) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- TARJETA 2: PARTE DEMANDANTE -->
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
          <h2 class="text-base font-semibold text-[#4A1525] mb-4 pb-2 border-b border-gray-100 flex items-center gap-2">
            <span>👤</span> Parte Demandante
          </h2>

          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                Tipo de Persona
              </label>
              <select
                formControlName="demandante_tipo"
                class="w-full p-2 text-sm border border-gray-300 rounded bg-white">
                <option value="Persona Física">Persona Física</option>
                <option value="Persona Jurídica">Persona Jurídica</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                Nombre Completo *
              </label>
              <input
                type="text"
                formControlName="demandante_nombre"
                placeholder="Nombre completo o razón social"
                class="w-full p-2 text-sm border border-gray-300 rounded bg-white" />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                  Cédula / RTN
                </label>
                <input
                  type="text"
                  formControlName="demandante_identificacion"
                  placeholder="080119994567"
                  class="w-full p-2 text-sm border border-gray-300 rounded bg-white" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                  Teléfono
                </label>
                <input
                  type="text"
                  formControlName="demandante_telefono"
                  placeholder="+504 9999-9999"
                  class="w-full p-2 text-sm border border-gray-300 rounded bg-white" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                Correo Electrónico
              </label>
              <input
                type="email"
                formControlName="demandante_correo"
                placeholder="correo@ejemplo.com"
                class="w-full p-2 text-sm border border-gray-300 rounded bg-white" />
            </div>
          </div>
        </div>

        <!-- TARJETA 3: PARTE DEMANDADA -->
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
          <h2 class="text-base font-semibold text-[#4A1525] mb-4 pb-2 border-b border-gray-100 flex items-center gap-2">
            <span>🛡️</span> Parte Demandada
          </h2>

          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                Tipo de Persona
              </label>
              <select
                formControlName="demandado_tipo"
                class="w-full p-2 text-sm border border-gray-300 rounded bg-white">
                <option value="Persona Física">Persona Física</option>
                <option value="Persona Jurídica">Persona Jurídica</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                Nombre Completo *
              </label>
              <input
                type="text"
                formControlName="demandado_nombre"
                placeholder="Nombre del demandado"
                class="w-full p-2 text-sm border border-gray-300 rounded bg-white" />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                  Cédula / RTN
                </label>
                <input
                  type="text"
                  formControlName="demandado_identificacion"
                  placeholder="080119994567"
                  class="w-full p-2 text-sm border border-gray-300 rounded bg-white" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                  Teléfono
                </label>
                <input
                  type="text"
                  formControlName="demandado_telefono"
                  placeholder="+504 9999-9999"
                  class="w-full p-2 text-sm border border-gray-300 rounded bg-white" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                Correo Electrónico
              </label>
              <input
                type="email"
                formControlName="demandado_correo"
                placeholder="demandado@ejemplo.com"
                class="w-full p-2 text-sm border border-gray-300 rounded bg-white" />
            </div>
          </div>
        </div>

      </div>

      <!-- TARJETA 4: ASIGNACIÓN DEL EQUIPO -->
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <h2 class="text-lg font-semibold text-[#4A1525] mb-4 pb-2 border-b border-gray-100 flex items-center gap-2">
          <span>⚖️</span> Asignación del Equipo
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
              Abogado Responsable
            </label>
            <input
              type="text"
              formControlName="abogado_responsable"
              placeholder="Dr. Carlos Mendoza"
              class="w-full p-2.5 text-sm border border-gray-300 rounded bg-white" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
              Paralegal Asignado
            </label>
            <input
              type="text"
              formControlName="paralegal_asignado"
              placeholder="Licda. Paula Leiva"
              class="w-full p-2.5 text-sm border border-gray-300 rounded bg-white" />
          </div>
        </div>
      </div>

      <!-- TARJETA 5: DESCRIPCIÓN DEL CASO -->
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <h2 class="text-lg font-semibold text-[#4A1525] mb-4 pb-2 border-b border-gray-100 flex items-center gap-2">
          <span>📝</span> Descripción del Caso
        </h2>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
            Resumen de Hechos y Pretensiones *
          </label>
          <textarea
            formControlName="descripcion_hechos"
            rows="4"
            placeholder="Redacte una descripción detallada de los hechos relevantes, pretensiones jurídicas y contexto del expediente..."
            class="w-full p-3 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-[#d4b88c] focus:outline-none bg-white"></textarea>
        </div>
      </div>

      <!-- PIE DE FORMULARIO - ACCIONES -->
      <div class="flex items-center justify-end gap-4 pt-4 border-t border-gray-200">
        <button
          type="button"
          (click)="cancelar()"
          class="px-6 py-2.5 border border-gray-300 rounded text-sm text-gray-700 bg-white hover:bg-gray-50 transition cursor-pointer">
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="guardando"
          class="px-6 py-2.5 bg-[#4A1525] hover:bg-[#38101c] text-white rounded text-sm font-medium transition cursor-pointer shadow flex items-center gap-2">
          <span>{{ guardando ? 'Guardando...' : 'Crear Expediente' }}</span>
        </button>
      </div>

    </form>
  </div>
</div>
