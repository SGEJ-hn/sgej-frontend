<!-- Login sin sidebar -->
@if (isLoginRoute()) {

  <router-outlet></router-outlet>

} @else {

  <!-- Layout principal -->
  <div class="app-layout flex h-screen w-full overflow-hidden bg-[#F3F2EE]">

    <!-- Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Contenido (FUSIONADO: Animación + Scroll + Tu clase app-content) -->
    <main 
      [@routeAnimations]="prepararRuta(outlet)" 
      class="app-content flex-1 h-screen overflow-y-auto overflow-x-hidden relative">
      
      <router-outlet #outlet="outlet"></router-outlet>

    </main>
    
  </div>

}
